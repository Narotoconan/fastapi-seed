[project]
name = "fastapi-seed-template-maintenance"
version = "0.0.0"
description = "Local maintenance environment for the FastAPI Copier template"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "copier>=9.17.0",
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--basetemp=.venv/.pytest-tmp",
]
